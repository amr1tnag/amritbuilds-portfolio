<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — amrit.builds</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0c'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='%23e8e8ec' font-family='monospace' font-weight='bold'%3E%7B%7D%3C/text%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #0a0a0c;
      color: #b8c4bd;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 20px;
    }
    .term {
      width: min(560px, 100%);
      background: #0b0e0c;
      border: 1px solid rgba(0, 229, 160, 0.25);
      border-radius: 14px;
      box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 60px rgba(0,229,160,.07);
      overflow: hidden;
    }
    .head {
      display: flex; align-items: center; gap: 7px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      font-size: 12px; color: #5d5b66;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .body { padding: 18px 20px 22px; font-size: 14px; line-height: 2; }
    .g { color: #00e5a0; } .r { color: #ff5470; } .d { color: #5d5b66; }
    .big { font-size: 44px; font-weight: 700; color: #eceaf1; line-height: 1.2; }
    a { color: #7cc7ff; }
    .caret { display: inline-block; width: 9px; height: 18px; background: #00e5a0; vertical-align: middle; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="term">
    <div class="head">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <span style="margin-left:8px">visitor@amrit.builds — bash</span>
    </div>
    <div class="body">
      <div><span class="g">visitor@amrit.builds:~$</span> cd <span id="path">this-page</span></div>
      <div class="r">bash: cd: no such file or directory</div>
      <div class="big">404</div>
      <div class="d">this page got refactored out of existence.</div>
      <div style="margin-top:14px"><span class="g">visitor@amrit.builds:~$</span> cd <a href="/amritbuilds-portfolio/">~/home</a><span class="caret"></span></div>
    </div>
  </div>
  <script>
    try { document.getElementById("path").textContent = location.pathname; } catch {}
  </script>
</body>
</html>
